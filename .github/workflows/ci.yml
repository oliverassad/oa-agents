name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -I -m unittest discover -s scripts
      - name: version guard
        run: python3 -I scripts/version_guard.py ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
